<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body { font-family: sans-serif; padding: 24px; color: #111; }
    h1 { margin-bottom: 8px; }
    p  { color: #555; margin-bottom: 20px; }
    .previews { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 24px; }
    .preview-item { text-align: center; }
    .preview-item span { display: block; font-size: 11px; color: #888; margin-top: 4px; }
    button {
      padding: 10px 24px; background: #7c3aed; color: white;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    .done { color: #059669; font-weight: 600; margin-top: 14px; display: none; }
  </style>
</head>
<body>
  <h1>✨ Icon Generator</h1>
  <p>Click the button to generate and download the three icon sizes. Move the downloaded files into the <code>icons/</code> folder.</p>

  <div class="previews" id="previews"></div>

  <button id="btn-download">Download All Icons</button>
  <div class="done" id="done">
    ✓ Done! Move icon16.png, icon48.png, and icon128.png into the <code>icons/</code> folder, then load the extension.
  </div>

  <script>
    const SIZES = [16, 48, 128];

    function drawIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Rounded-rect background
      const r = Math.round(size * 0.18);
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.arcTo(size, 0, size, r, r);
      ctx.lineTo(size, size - r);
      ctx.arcTo(size, size, size - r, size, r);
      ctx.lineTo(r, size);
      ctx.arcTo(0, size, 0, size - r, r);
      ctx.lineTo(0, r);
      ctx.arcTo(0, 0, r, 0, r);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#8b5cf6');
      grad.addColorStop(1, '#6c47ff');
      ctx.fillStyle = grad;
      ctx.fill();

      // Sparkle ✨ — use a plain star at very small sizes
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (size <= 16) {
        // Simple white circle at tiny sizes
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size * 0.28, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.font = `${Math.round(size * 0.52)}px serif`;
        ctx.fillText('✨', size / 2, size / 2 + size * 0.03);
      }

      return canvas;
    }

    // Show previews
    const previewsEl = document.getElementById('previews');
    SIZES.forEach(size => {
      const canvas = drawIcon(size);
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.appendChild(canvas);
      const label = document.createElement('span');
      label.textContent = `${size}×${size}`;
      item.appendChild(label);
      previewsEl.appendChild(item);
    });

    // Download on click
    document.getElementById('btn-download').addEventListener('click', () => {
      SIZES.forEach(size => {
        const canvas = drawIcon(size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `icon${size}.png`;
        a.click();
      });
      document.getElementById('done').style.display = 'block';
    });
  </script>
</body>
</html>
